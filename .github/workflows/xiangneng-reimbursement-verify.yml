name: Verify reimbursement prototype

on:
  push:
    branches:
      - agent/xiangneng-reimbursement-v0.2
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd xiangneng-reimbursement-system && npm run verify
